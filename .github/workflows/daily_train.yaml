name: Daily model training

# Retrains all three forecast models, registers them, and refreshes the
# dashboard snapshot.
#
# Five steps, in this order:
#   08_hourly_collector   -> bring the store up to date first
#   06_train              -> the absolute models (days 2 and 3)
#   06b_train_delta       -> the delta model (day 1)
#   07_register_models    -> upload whichever file each horizon uses
#   10_build_snapshot     -> regenerate the dashboard data, then commit
#
# The snapshot step matters for deployment. Streamlit Cloud serves from
# the repo, so the dashboard reads a committed JSON file rather than
# calling Hopsworks on every page load - that would take 30-60 seconds
# when the store is healthy and time out entirely when the free-tier
# quota is spent. Committing the snapshot here keeps the deployed
# dashboard current without making visitors wait.

on:
  schedule:
    # 02:00 UTC = 07:00 Pakistan time, after several hourly collections
    - cron: "0 2 * * *"

  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # Needed to push the snapshot commit back to the repo
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect the latest data first
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        # Non-blocking: if collection fails, training still runs on
        # whatever the store already holds.
        continue-on-error: true
        run: python pipeline/08_hourly_collector.py

      - name: Train the absolute models (days 2 and 3)
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: python pipeline/06_train.py

      - name: Train the delta model (day 1)
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: python pipeline/06b_train_delta.py

      - name: Register all three models
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: python pipeline/07_register_models.py

      - name: Rebuild the dashboard snapshot
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: python pipeline/10_build_snapshot.py

      - name: Commit the snapshot back to the repo
        # -f is needed because data/ is gitignored; the snapshot is the
        # one file in there we deliberately track.
        # [skip ci] stops this commit triggering another workflow run.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/dashboard_snapshot.json
          if git diff --staged --quiet; then
            echo "Snapshot unchanged - nothing to commit."
          else
            git commit -m "Update dashboard snapshot [skip ci]"
            git push
            echo "Snapshot committed."
          fi

      - name: Upload metrics as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-${{ github.run_number }}
          path: |
            models/metrics.json
            models/metrics_delta.json
            models/feature_cols.json
          retention-days: 30

      - name: Explain a failure
        if: failure()
        run: |
          echo "Training failed. Common causes:"
          echo "  - Hopsworks free-tier quota exhausted"
          echo "  - Not enough new data since the last run"
          echo "The previously registered models stay live, and the"
          echo "dashboard keeps serving the last good snapshot."